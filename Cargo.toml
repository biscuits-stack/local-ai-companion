[package]
name = "local_ai_companion"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSEvent", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSObjCRuntime", "NSString"] }
